spring.application.name=FitPlanner
spring.datasource.url=jdbc:mysql://localhost:3307/fitplanner?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

wger.base-url=https://wger.de/api/v2
wger.language=9

openfoodfacts.base-url=https://search.openfoodfacts.org
openfoodfacts.max-items=2000

# Set env JWT_SECRET, or put app.jwt.secret (min 32 bytes) in untracked ./secrets.properties
spring.config.import=optional:file:./secrets.properties
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=24h